######################################################
##### MODULE 1 Quality Contol Configuration file #####
######################################################

qc:
  fastqc:
    threads: 2
  fastp:
    options: "--detect_adapter_for_pe --length_required 60 --cut_right --cut_right_window_size 5 --cut_mean_quality 20 --trim_poly_g --trim_poly_x --poly_x_min_len 10"
    threads: 8
  bwa_contaminants:
    database: /data_2/Databases/Contamination/GRCH38genomeMT_mitochondrion_organalle.fna
    threads: 12
  contamination_source_ids:
    options: -f 2 -q 30 -l 50 -r 0.5
  decontamination:
    threads: 8
