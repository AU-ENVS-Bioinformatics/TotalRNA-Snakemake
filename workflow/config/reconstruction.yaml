reconstruction:
  non_rRNA_method: rnaspades # trinity? megahit? 
  rRNA_method: rnaspades #rnaspades metarib matam? 
  refinement: both # coassembly | samples | both | all
  # Separate assemblies across all samples
  coassembly_targets:
    - non_rRNA
    - SSU
  coassembly_postprocessing:
    non_rRNA:
      minlength: 300
      maxlength: null
      rfam_database: /data_2/Databases/RFAM_october26/ncRNA/ncRNA_gene_models.cm
      ncrna_min_contig_coverage: 0.90
    SSU:
      minlength: 1200
      maxlength: 2000
      rfam_database: /data_2/Databases/RFAM_october26/rRNA/ssu.cm
      min_ssu_contig_coverage: 0.80
      chimera:
        options: "--notrunclabels --fasta_width 0"
    dereplicate_options: "--strand both --notrunclabels --fasta_width 0"
    cmsearch:
      threads: 16
      options: "--cut_ga"
  # Sample-specific assemblies
  targets:
    - SSU
    - ITS_candidates
  rnaspades:
    memory: 500
    max_memory_gb: 900
    threads: 12
  metarib:
    threads: 16
    EM_REF: /data_2/Databases/emirge_db/SILVA_138.1_SSURef_NR99_tax_silva_trunc.ge1200bp.le2000bp.0.97.fixed.fasta
    EM_BT: /data_2/Databases/emirge_db/SILVA_138.1_SSURef_NR99_tax_silva_trunc.ge1200bp.le2000bp.0.97.fixed
    SAMPLING_NUM: 1000000
    EM_PARA: "--phred33 -l 151 -i 300 -s 75 -n 25"
    MAP_PARA: "minid=0.96 maxindel=1 minhits=2 idfilter=0.98"
    CLS_PARA: "fo=t ow=t c=t mcs=1 e=5 mid=99"
    MIN_COV: 2
    MIN_PER: 80
  rnaspades_sample:
    memory: 250
    threads: 10
  itsx:
    options: "--detailed_results T --summary T --graphical T --fasta T --only_full F --partial 150"
    species: "Fungi"
    regions: "ITS1,5.8S,ITS2"
    threads: 12
  ssu_postprocessing:
    chimera:
      threads: 12
      options: "--notrunclabels --fasta_width 0"
      references:
        bacteria: /data_2/Databases/SILVA_138.2/SILVA_138.2_SSU_bacteria/SILVA_138.2_bacteria_SSU.dna.fasta
        archaea: /data_2/Databases/SILVA_138.2/SILVA_138.2_SSU_archaea/SILVA_138.2_archaea_SSU.dna.fasta
        eukaryotes: /data_2/Databases/PR2_5.1.1/pr2_version_5.1.1_SSU_mothur.fasta