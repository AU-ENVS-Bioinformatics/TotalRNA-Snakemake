reconstruction:
  non_rRNA_method: rnaspades # trinity? megahit? 
  rRNA_method: rnaspades #rnaspades metarib matam? 
  refinement: coassembly # coassembly | samples | both | all
  # Separate assemblies across all samples
  coassembly_targets:
    - non_rRNA
    - SSU
  coassembly_postprocessing:
    non_rRNA:
      minlength: 300
      maxlength: null
      rfam_database: /data_2/Databases/RFAM_october26/ncRNA/ncRNA_gene_models.cm
      ncrna_min_contig_coverage: 0.90
    SSU:
      minlength: 1200
      maxlength: 2000
      rfam_database: /data_2/Databases/RFAM_october26/rRNA/ssu.cm
      min_ssu_contig_coverage: 0.80
      chimera:
        options: "--notrunclabels --fasta_width 0"
    dereplicate_options: "--strand both --notrunclabels --fasta_width 0"
    cmsearch:
      threads: 16
      options: "--cut_ga"
  # Sample-specific assemblies
  targets:
    - SSU
    - ITS_candidates
  rnaspades:
    memory: 500
    max_memory_gb: 900
    threads: 12
  metarib:
    threads: 16
    EM_REF: /data_2/Databases/emirge_db/SILVA_138.1_SSURef_NR99_tax_silva_trunc.ge1200bp.le2000bp.0.97.fixed.fasta
    EM_BT: /data_2/Databases/emirge_db/SILVA_138.1_SSURef_NR99_tax_silva_trunc.ge1200bp.le2000bp.0.97.fixed
    SAMPLING_NUM: 1000000
    EM_PARA: "--phred33 -l 151 -i 300 -s 75 -n 25"
    MAP_PARA: "minid=0.96 maxindel=1 minhits=2 idfilter=0.98"
    CLS_PARA: "fo=t ow=t c=t mcs=1 e=5 mid=99"
    MIN_COV: 2
    MIN_PER: 80
  rnaspades_sample:
    memory: 250
    threads: 10
  itsx:
    options: "--detailed_results T --summary T --graphical T --fasta T"
    species: "Fungi"
    regions: "ITS1,5.8S,ITS2"
    threads: 12
  barrnap:
    kingdom: # bac | arc 
      - bac
      - arc
      - fun
    options: "--rrna"
    threads: 12
  cmsearch:
    models:
      bac: /path/to/RF00177.cm
      arc: /path/to/RF01959.cm
    threads: 16
    options: "--cut_ga"
  ssu_postprocessing:
    prediction_method: false
    min_length: 1000
    features:
      bac: "16S_rRNA"
      arc: "16S_rRNA"
      fun: "18S_rRNA"
    dereplication:
      threads: 1
      options: "--strand plus --minseqlength 1000 --sizeout --maxseqlength 1000000  --fasta_width 0"
    chimera:
      threads: 12
      options: "--minseqlength 1000 --maxseqlength 1000000 --fasta_width 0"
      references:
        bac: /data_2/Databases/SILVA_138.2/SILVA_138.2_SSU_bacteria/SILVA_138.2_bacteria_SSU.dna.fasta
        arc: /data_2/Databases/SILVA_138.2/SILVA_138.2_SSU_archaea/SILVA_138.2_archaea_SSU.dna.fasta
        fun: /data_2/Databases/PR2_5.1.1/pr2_version_5.1.1_SSU_mothur.fasta
