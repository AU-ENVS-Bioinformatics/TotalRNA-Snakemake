# Main configuration for the Total RNA Snakemake workflow.
# Relative module config paths are resolved from the directory containing this file.

# Input samplesheet
samples_file: /data/rasmus/TotalRNA-Snakemake/dataset/samplesheet_v3.tsv

# Root directory for results
shared_results_dir: /data/rasmus/Dev/SnakeResDev

# Optional module completion targets
modules:
  taxonomy: false
  phylogeny: false
  habitat_refinement: false
  functional_profiling: false
  viral_sequence_analysis: false

# Module configuration files.
# These filenames are expected beside this main config file. Replace any value with an absolute path or a path relative to this file when a module config is stored elsewhere.

module_config_files:
  qc: qc_config.yaml
  rna_classification: rna_classification_config.yaml
  reconstruction: reconstruction.yaml
  taxonomy: taxonomy.yaml
  phylogeny: phylogeny.yaml
  habitat_refinement: habitat_refinement.yaml
  functional_profiling: functional_profiling.yaml
  viral_sequence_analysis: viral_sequence_analysis.yaml
