samples_file: /data/rasmus/TotalRNA-Snakemake/dataset/samplesheet.tsv

shared_results_dir: /data/rasmus/Dev/SnakeResDev

databases:
  human_GRCh38_genome: /data_2/Databases/GRCh38/GCF_000001405.40_GRCh38.p14_genomic.fna
  human_T2T_genome: /data_2/Databases/T2T‑CHM13/GCF_009914755.1_T2T-CHM13v2.0_genomic.fna
  chloroplast_genome: /data_2/Databases/plant_organelle/refseq_chloroplast.fna 
  mitochondrion_genome: /data_2/Databases/mitochondrion/mitochondrion.1.1.genomic.fna
  genome_for_decontamination: /data_2/Databases/Contamination/GRCH38genomeMT_mitochondrion_organalle.fna
  sortmeRNA_ssu: /data_2/Databases/SILVA_138/SILVA_138.1_SSURef_NR99_tax_silva_trunc.fasta
  sortmeRNA_ssu_idx: /data_2/Databases/sortmerna_idx/SSU/
  sortmeRNA_lsu: /data_2/Databases/SILVA_138/SILVA_138.1_LSURef_NR99_tax_silva_trunc.fasta
  sortmeRNA_lsu_idx: /data_2/Databases/sortmerna_idx/LSU/
  crest4_db: /data_2/Databases/crest4/silvamod138pr2
  kraken_db: /data_2/Databases/kraken2_dbs

# decontamination_sources: #combine human, chloroplast, mitochondrion or somethign

#######################
### Module settings ###
#######################

qc:
  fastqc:
    threads: 2
  fastp:
    options: "--detect_adapter_for_pe --length_required 60 --cut_right --cut_right_window_size 5 --cut_mean_quality 20 --trim_poly_g --trim_poly_x --poly_x_min_len 10"
    threads: 8
  kraken2:
    options: "--confidence 0.1 --use-names"
    threads: 10
  bwa_contaminants:
    threads: 16
  contamination_source_ids:
    options: -f 2 -q 30 -l 50 -r 0.5
  decontamination:
    threads: 8

RNA:
  method: ribodetector        # sortmerna | ribodetector | other methods to be added in the future, e.g. based on mapping or something else
  sortmerna:
    options: "--fastx --paired_in --out2"
    threads: 12
    pipeline:
      - ssu
      - lsu
    # should we add the 0.97 identity as well to ensure if we change in the rRNA section, then 
    # the sortmerna created OTU would be comparable to the qiime2 created OTU?
  ribodetector:
    options: "--ensure both"
    threads: 15
  bwa_mem:
    options: ""
    threads: 16
  bbmap:
    options: ""
    threads: 16
  samtools_filter:
    options: "-F 4" # this is the option to filter out unmapped reads (the non-rRNA reads), so only keep mapped reads (rRNA reads in this case)
    threads: 8

rRNA:
  qiime2_otu:
    method: de-novo        # de-novo | closed-reference | open-reference
    identity: 0.97
    pipeline: 
      - ssu
    threads: 12

